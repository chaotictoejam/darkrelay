name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install ffmpeg (transcoder tests run real encodes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - name: Validate fixture feeds
        run: |
          for f in packages/core/test/fixtures/*.xml; do npx darkrelay validate "$f"; done
      - name: Validate a feed built from an imported fixture
        run: |
          npx darkrelay import https://anchor.fm/s/abc123/podcast/rss --show example \
            --file packages/core/test/fixtures/anchor-style.xml --dry-run --out /tmp/import
          npx darkrelay validate /tmp/import/feed.preview.xml
      - run: npm run build:dashboard
      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: '123456789012'
        run: |
          jq '.domain.hostedZoneId = "Z0000000000000"' darkrelay.config.example.json > /tmp/c.json
          DARKRELAY_CONFIG=/tmp/c.json npm run synth
      - name: Build transcoder image
        run: docker build -f packages/transcoder/Dockerfile -t darkrelay-transcoder .
